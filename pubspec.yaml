name: zerowire
description: "ZeroWire - Ultra-fast P2P file transfer"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^7.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  dio: ^5.9.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  lucide_icons: ^0.257.0
  google_fonts: ^8.0.2

  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  media_scanner: ^2.2.1
  open_filex: ^4.7.0
  photo_manager: ^3.9.0
  device_apps: ^2.2.0
  on_audio_query: ^2.9.0
  video_thumbnail: ^0.5.6
  fl_chart: ^0.68.0
  device_info_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/zerowire_logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/zerowire_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/zerowire_logo.png
