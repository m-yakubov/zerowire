<style>
        body { font-family: 'Manrope', sans-serif; }
        .glass-card {
            background: rgba(53, 52, 58, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }

            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15), inset 0 0 10px rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }
        .neon-glow-purple {
            box-shadow: 0 0 20px rgba(236, 178, 255, 0.15), inset 0 0 10px rgba(236, 178, 255, 0.1);
            border: 1px solid rgba(236, 178, 255, 0.2);

    body {

<body class="bg-surface text-on-surface min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-zinc-950/60 backdrop-blur-xl flex justify-between items-center px-6 h-16 w-full shadow-[0_4px_30px_rgba(0,0,0,0.1)]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-cyan-400" data-icon="terminal">terminal</span>
<h1 class="text-2xl font-black tracking-widest text-cyan-400 drop-shadow-[0_0_8px_rgba(0,240,255,0.5)] font-['Space_Grotesk'] tracking-tighter uppercase font-bold">ZeroWire</h1>
</div>
<div class="flex gap-4">
<button class="text-zinc-500 hover:text-cyan-300 transition-colors duration-300 active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="text-zinc-500 hover:text-cyan-300 transition-colors duration-300 active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
<div class="bg-gradient-to-r from-transparent via-cyan-500/20 to-transparent h-[1px] w-full absolute bottom-0"></div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center px-6 pt-24 pb-32 space-y-8 max-w-lg mx-auto w-full">
<!-- Hero Visual Section -->
<div class="w-full text-center space-y-2 mb-4">
<div class="inline-flex items-center px-4 py-1 rounded-full bg-primary/10 border border-primary/20 mb-4">
<span class="w-2 h-2 rounded-full bg-primary-container animate-pulse mr-2"></span>
<span class="text-[10px] font-label uppercase tracking-widest text-primary">Node Online</span>
</div>
<h2 class="text-4xl font-headline font-bold text-on-background tracking-tight">Quantum Bridge</h2>
<p class="text-on-surface-variant font-body text-sm max-w-[280px] mx-auto">Ultra-fast peer-to-peer data distribution across encrypted local channels.</p>
</div>
<!-- Action Card 1: Send -->
<button class="group w-full glass-card neon-glow-cyan rounded-full p-8 flex flex-col items-center justify-center space-y-4 transition-all duration-500 hover:-translate-y-2 hover:bg-zinc-900/60">
<div class="w-20 h-20 rounded-full bg-gradient-to-br from-primary-container/30 to-primary-fixed-dim/10 flex items-center justify-center shadow-[0_0_30px_rgba(0,240,255,0.2)]">
<span class="material-symbols-outlined text-5xl text-primary" data-icon="upload_file" style="font-variation-settings: 'FILL' 1;">upload_file</span>
</div>
<div class="text-center">
<h3 class="text-xl font-headline font-bold text-primary tracking-wide">INITIALIZE NODE</h3>
<p class="text-[10px] font-label uppercase tracking-[0.2em] text-cyan-400/60 mt-1">(Send File)</p>
</div>
<div class="absolute inset-0 bg-primary/5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<!-- Action Card 2: Receive -->
<button class="group w-full glass-card neon-glow-purple rounded-full p-8 flex flex-col items-center justify-center space-y-4 transition-all duration-500 hover:-translate-y-2 hover:bg-zinc-900/60">
<div class="w-20 h-20 rounded-full bg-gradient-to-br from-secondary-container/30 to-secondary/10 flex items-center justify-center shadow-[0_0_30_rgba(236,178,255,0.2)]">
<span class="material-symbols-outlined text-5xl text-secondary" data-icon="settings_input_antenna" style="font-variation-settings: 'FILL' 1;">settings_input_antenna</span>
</div>
<div class="text-center">
<h3 class="text-xl font-headline font-bold text-secondary tracking-wide">ESTABLISH LINK</h3>
<p class="text-[10px] font-label uppercase tracking-[0.2em] text-secondary/60 mt-1">(Receive)</p>
</div>
<div class="absolute inset-0 bg-secondary/5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<!-- Dynamic Visual Detail -->
<div class="pt-8 w-full">
<div class="surface-container-low rounded-full p-4 flex items-center justify-between">
<div class="flex items-center gap-3">

<img class="w-full h-full object-cover" data-alt="Cyberpunk high-tech glowing network hardware with neon light details" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBvhS6FcX8pX-KPtvzz1GACfxgNPirorX5yR91oOXfUYGeiXEDJ1au4rFleKwCUhc7_gVRbZHf2qw3GVCOlo-Xad8u98xQEw4Wu5rbUL5al8ijSu7umWdw5vBwiIVyzrB7Ezymm4DGbeA3SCECGOdi6rmj0zfFZranKjhUNZU7rctLgEkaSdRiZeGRQ5SNvcMmUl_i_aspJ2VP2anosLm_0h9k4j6UOQEowVu8bLoMaYHTtDXf2aL48toPm4m_ZsKOf7Muxy0XxuAg"/>
</div>
<div>
<p class="text-xs font-bold text-on-surface">Z-BRIDGE-04</p>
<p class="text-[10px] text-zinc-500">Active Mesh Link</p>
</div>
</div>
<div class="flex items-center gap-1">
<div class="h-1 w-8 bg-cyan-400/20 rounded-full overflow-hidden">
<div class="h-full w-2/3 bg-cyan-400"></div>
</div>
<span class="text-[9px] text-cyan-400 font-mono">68%</span>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-8 pb-6 pt-3 bg-zinc-950/40 backdrop-blur-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.5)] rounded-t-[2rem] z-50">
<a class="flex flex-col items-center justify-center bg-cyan-500/10 text-cyan-400 rounded-xl p-3 shadow-[inset_0_0_10px_rgba(0,240,255,0.2)] active:scale-90 duration-200 ease-out transition-all hover:text-cyan-200" href="#">
<span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
<span class="font-['Manrope'] text-[10px] uppercase tracking-widest mt-1">Home</span>

<a class="flex flex-col items-center justify-center text-zinc-600 p-3 active:scale-90 duration-200 ease-out transition-all hover:text-cyan-200" href="#">
<span class="material-symbols-outlined" data-icon="sensors">sensors</span>
<span class="font-['Manrope'] text-[10px] uppercase tracking-widest mt-1">Nodes</span>

<span class="material-symbols-outlined" data-icon="settings_bolt">bolt</span>
<span class="font-['Manrope'] text-[10px] uppercase tracking-widest mt-1">Core</span>
</a>
</nav>
