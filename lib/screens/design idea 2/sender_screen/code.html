<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ZeroWire | Sender Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-variant": "#35343a",
                    "on-primary-fixed-variant": "#004f54",
                    "tertiary-fixed": "#e2e2e2",
                    "primary-container": "#00f0ff",
                    "surface": "#131318",
                    "on-secondary-container": "#480063",
                    "tertiary": "#f5f5f5",
                    "on-tertiary-container": "#5d5f5f",
                    "inverse-surface": "#e4e1e9",
                    "error-container": "#93000a",
                    "on-surface-variant": "#b9cacb",
                    "on-tertiary-fixed-variant": "#454747",
                    "on-error-container": "#ffdad6",
                    "on-background": "#e4e1e9",
                    "surface-container-highest": "#35343a",
                    "background": "#131318",
                    "on-primary-fixed": "#002022",
                    "secondary-fixed-dim": "#ecb2ff",
                    "inverse-primary": "#006970",
                    "surface-dim": "#131318",
                    "outline-variant": "#3b494b",
                    "primary-fixed": "#7df4ff",
                    "on-tertiary": "#2f3131",
                    "on-primary-container": "#006970",
                    "on-secondary-fixed-variant": "#74009f",
                    "on-primary": "#00363a",
                    "on-secondary-fixed": "#320047",
                    "surface-container": "#1f1f25",
                    "on-error": "#690005",
                    "error": "#ffb4ab",
                    "surface-container-high": "#2a292f",
                    "on-secondary": "#520071",
                    "surface-bright": "#39383e",
                    "secondary": "#ecb2ff",
                    "primary": "#dbfcff",
                    "inverse-on-surface": "#303036",
                    "secondary-container": "#cf5cff",
                    "on-tertiary-fixed": "#1a1c1c",
                    "secondary-fixed": "#f8d8ff",
                    "tertiary-fixed-dim": "#c6c6c7",
                    "surface-container-low": "#1b1b20",
                    "on-surface": "#e4e1e9",
                    "tertiary-container": "#d9d9d9",
                    "surface-tint": "#00dbe9",
                    "primary-fixed-dim": "#00dbe9",
                    "surface-container-lowest": "#0e0e13",
                    "outline": "#849495"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .radar-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid theme('colors.primary-container');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-slate-950/40 backdrop-blur-xl bg-gradient-to-b from-slate-900/50 to-transparent shadow-none">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="text-cyan-400 active:scale-95 duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-space-grotesk font-black text-2xl tracking-tighter text-cyan-400 drop-shadow-[0_0_8px_rgba(0,240,255,0.5)]">ZeroWire</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full border border-primary-container/30 overflow-hidden ring-2 ring-primary-container/10">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="close-up portrait of a man with minimalist digital fashion lighting and a cybernetic aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuANhi6NaK_OHLPXBfxpJOLzpa8v2nys2ogSHn5GYjdmpsbWhqoPqVw1dhYNaIBDGta3NClsYy6p3CPCIcxTyfcxck-D0MXLy526elDJbiMmS0X9A8YrGTWmX6-CRUKU1C2nxUmXw6_S66TwrZ5Cvrd-4HzV3JCsNWE6STjhlZ7Amu9yIa3BTVlkxJcQTflRVRjUeHb3qbDhKpOhI7Pkrm66vclKS_qj_znxlazhzcyu3fiUzAFUdkU8zUlLtTVeQwFtxlPAQWAzC_8"/>
</div>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 pb-32 px-6 flex flex-col items-center justify-center relative overflow-hidden">
<!-- Radar Background Decoration -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-20">
<div class="radar-ring w-[300px] h-[300px] opacity-100 border-cyan-400/40"></div>
<div class="radar-ring w-[450px] h-[450px] opacity-60 border-cyan-400/20"></div>
<div class="radar-ring w-[600px] h-[600px] opacity-30 border-cyan-400/10"></div>
<div class="radar-ring w-[800px] h-[800px] opacity-10 border-cyan-400/5"></div>
</div>
<!-- Central QR/Broadcast Container -->
<section class="relative z-10 w-full max-w-md flex flex-col items-center mb-12">
<div class="relative group">
<!-- Glowing Backdrop -->
<div class="absolute -inset-4 bg-primary-container/10 blur-3xl rounded-full group-hover:bg-primary-container/20 transition-all duration-700"></div>
<!-- QR Container -->
<div class="relative bg-surface-container-high/60 backdrop-blur-3xl p-8 rounded-[2.5rem] border border-outline-variant/20 shadow-2xl">
<div class="w-64 h-64 bg-primary p-4 rounded-3xl flex items-center justify-center relative overflow-hidden">
<!-- Simulated QR Code -->
<div class="w-full h-full bg-surface grid grid-cols-8 grid-rows-8 gap-1 p-2 rounded-xl opacity-90">
<div class="bg-on-surface col-span-3 row-span-3 rounded-sm"></div>
<div class="bg-on-surface col-start-6 col-span-3 row-span-3 rounded-sm"></div>
<div class="bg-on-surface col-span-3 row-start-6 row-span-3 rounded-sm"></div>
<div class="bg-on-surface/40 col-start-4 row-start-4 rounded-sm"></div>
<div class="bg-on-surface/60 col-start-5 row-start-5 rounded-sm"></div>
<div class="bg-on-surface col-start-4 row-start-2 rounded-sm"></div>
<div class="bg-on-surface/80 col-start-7 row-start-4 rounded-sm"></div>
<div class="bg-on-surface col-start-5 row-start-7 rounded-sm"></div>
</div>
<!-- Pulse Data Point Overlay -->
<div class="absolute inset-0 bg-primary-container/5 pointer-events-none ring-inset ring-2 ring-primary-container/20 rounded-3xl"></div>
</div>
</div>
<!-- Active Status Indicator -->
<div class="absolute -bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-slate-900/80 backdrop-blur-md px-6 py-2 rounded-full border border-cyan-400/30 shadow-[0_0_20px_rgba(0,240,255,0.2)]">
<span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_8px_#00f0ff]"></span>
<span class="font-headline font-bold text-[10px] tracking-widest text-cyan-400 uppercase">Broadcasting</span>
</div>
</div>
</section>
<!-- Glassmorphic Payload Summary Card -->
<section class="w-full max-w-sm relative z-10">
<div class="bg-surface-variant/40 backdrop-blur-2xl p-6 rounded-3xl border border-outline-variant/10 shadow-lg">
<div class="flex items-center gap-5 mb-4">
<div class="w-14 h-14 rounded-2xl bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-primary-fixed-dim text-3xl">cloud_upload</span>
</div>
<div>
<h3 class="font-headline text-lg font-bold text-on-surface tracking-tight">Awaiting Payload...</h3>
<p class="font-label text-xs text-on-surface-variant uppercase tracking-widest">Connection: Secure P2P</p>
</div>
</div>
<div class="h-[2px] w-full bg-gradient-to-r from-transparent via-outline-variant/20 to-transparent mb-4"></div>
<div class="flex justify-between items-center text-on-surface-variant">
<div class="flex flex-col">
<span class="text-[10px] uppercase font-bold text-outline tracking-wider">Queue</span>
<span class="text-sm font-medium">Empty</span>
</div>
<div class="flex flex-col text-right">
<span class="text-[10px] uppercase font-bold text-outline tracking-wider">Bitrate</span>
<span class="text-sm font-medium">--- Mbps</span>
</div>
</div>
</div>
</section>
</main>
<!-- Fixed Action Bar (The 'Select Payload' Button) -->
<div class="fixed bottom-24 left-0 w-full px-6 z-40">
<button class="w-full max-w-md mx-auto flex items-center justify-center gap-3 bg-gradient-to-r from-primary-container to-primary py-5 rounded-full shadow-[0_15px_40px_rgba(0,240,255,0.25)] hover:shadow-[0_20px_50px_rgba(0,240,255,0.35)] active:scale-[0.98] transition-all duration-300 group">
<span class="material-symbols-outlined text-on-primary-container font-bold group-hover:rotate-12 transition-transform">add_box</span>
<span class="font-headline font-black text-on-primary-container uppercase tracking-tighter text-lg">Select Payload to Transmit</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-slate-900/60 backdrop-blur-2xl rounded-t-[2.5rem] pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.4)]">
<!-- Active: Send -->
<a class="flex flex-col items-center justify-center text-cyan-400 bg-cyan-400/10 rounded-2xl px-5 py-2 ring-1 ring-cyan-400/20 shadow-[0_0_15px_rgba(0,240,255,0.2)] active:scale-90 duration-300 ease-out" href="#">
<span class="material-symbols-outlined">schema</span>
<span class="font-manrope font-medium text-[10px] uppercase tracking-[0.1em] mt-1">Send</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 px-5 py-2 hover:bg-slate-800/50 rounded-2xl transition-all active:scale-90 duration-300 ease-out" href="#">
<span class="material-symbols-outlined">install_mobile</span>
<span class="font-manrope font-medium text-[10px] uppercase tracking-[0.1em] mt-1">Receive</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 px-5 py-2 hover:bg-slate-800/50 rounded-2xl transition-all active:scale-90 duration-300 ease-out" href="#">
<span class="material-symbols-outlined">quick_reference_all</span>
<span class="font-manrope font-medium text-[10px] uppercase tracking-[0.1em] mt-1">History</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 px-5 py-2 hover:bg-slate-800/50 rounded-2xl transition-all active:scale-90 duration-300 ease-out" href="#">
<span class="material-symbols-outlined">encrypted</span>
<span class="font-manrope font-medium text-[10px] uppercase tracking-[0.1em] mt-1">Vault</span>
</a>
</nav>
</body></html>
