<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ZeroWire Receiver</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-container": "#006970",
                    "surface-container-highest": "#35343a",
                    "outline-variant": "#3b494b",
                    "on-secondary-fixed": "#320047",
                    "on-error-container": "#ffdad6",
                    "surface-tint": "#00dbe9",
                    "primary-fixed": "#7df4ff",
                    "surface-variant": "#35343a",
                    "surface-container-high": "#2a292f",
                    "secondary-fixed": "#f8d8ff",
                    "on-secondary": "#520071",
                    "surface-container-lowest": "#0e0e13",
                    "tertiary-fixed": "#e2e2e2",
                    "on-secondary-container": "#480063",
                    "on-primary-fixed": "#002022",
                    "inverse-primary": "#006970",
                    "secondary-fixed-dim": "#ecb2ff",
                    "on-primary": "#00363a",
                    "outline": "#849495",
                    "background": "#131318",
                    "inverse-on-surface": "#303036",
                    "surface-container": "#1f1f25",
                    "on-surface-variant": "#b9cacb",
                    "on-tertiary": "#2f3131",
                    "primary": "#dbfcff",
                    "on-primary-fixed-variant": "#004f54",
                    "on-surface": "#e4e1e9",
                    "error": "#ffb4ab",
                    "primary-fixed-dim": "#00dbe9",
                    "surface-container-low": "#1b1b20",
                    "surface-bright": "#39383e",
                    "on-tertiary-fixed-variant": "#454747",
                    "tertiary": "#f5f5f5",
                    "on-error": "#690005",
                    "tertiary-fixed-dim": "#c6c6c7",
                    "inverse-surface": "#e4e1e9",
                    "surface": "#131318",
                    "primary-container": "#00f0ff",
                    "secondary": "#ecb2ff",
                    "on-secondary-fixed-variant": "#74009f",
                    "error-container": "#93000a",
                    "surface-dim": "#131318",
                    "secondary-container": "#cf5cff",
                    "tertiary-container": "#d9d9d9",
                    "on-tertiary-container": "#5d5f5f",
                    "on-tertiary-fixed": "#1a1c1c",
                    "on-background": "#e4e1e9"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scanner-viewport {
            background: linear-gradient(rgba(19, 19, 24, 0.4), rgba(19, 19, 24, 0.4)), url('image-scanner-preview');
            background-size: cover;
            background-position: center;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        .hud-pulse {
            animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- TopAppBar Shell -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 py-4 bg-transparent backdrop-blur-md dark:bg-black/20 no-border backdrop-blur-2xl shadow-none">
<button class="text-cyan-400 dark:text-cyan-400 scale-95 active:scale-90 transition-transform hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-['Space_Grotesk'] tracking-tight text-2xl font-bold text-cyan-400 uppercase tracking-widest">ZeroWire</h1>
<button class="text-cyan-400 dark:text-cyan-400 scale-95 active:scale-90 transition-transform hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">flashlight_on</span>
</button>
</header>
<!-- Main Viewfinder Area -->
<main class="relative h-screen w-full scanner-viewport flex flex-col items-center justify-center" data-alt="POV of a high-tech smartphone camera viewfinder focused on a dimly lit futuristic room with neon circuit patterns on the walls">
<!-- HUD Reticle Targeting Frame -->
<div class="relative w-72 h-72 md:w-96 md:h-96 flex items-center justify-center">
<!-- Corner Brackets (The Reticle) -->
<div class="absolute inset-0 border-2 border-transparent">
<!-- Top Left -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-[#39FF14] dark:border-[#39FF14] rounded-tl-xl hud-pulse"></div>
<!-- Top Right -->
<div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-[#39FF14] dark:border-[#39FF14] rounded-tr-xl hud-pulse"></div>
<!-- Bottom Left -->
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-[#39FF14] dark:border-[#39FF14] rounded-bl-xl hud-pulse"></div>
<!-- Bottom Right -->
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-[#39FF14] dark:border-[#39FF14] rounded-br-xl hud-pulse"></div>
</div>
<!-- Scanning Line -->
<div class="absolute top-1/2 left-4 right-4 h-[2px] bg-[#39FF14]/40 shadow-[0_0_15px_#39FF14] -translate-y-1/2"></div>
<!-- Center Focus Point -->
<div class="w-2 h-2 rounded-full bg-[#39FF14] shadow-[0_0_10px_#39FF14]"></div>
<!-- Floating Metadata Tags -->
<div class="absolute top-[-40px] left-0 font-headline text-[10px] tracking-[0.2em] text-[#39FF14] opacity-70 uppercase">
                Searching_Frequencies...
            </div>
<div class="absolute bottom-[-40px] right-0 font-headline text-[10px] tracking-[0.2em] text-[#39FF14] opacity-70 uppercase">
                Range: 2.4GHz / 5GHz
            </div>
</div>
<!-- Floating Action Layer -->
<div class="absolute top-24 left-6 flex flex-col gap-4">
<div class="px-3 py-1 rounded-full bg-surface-container-high/40 backdrop-blur-xl border border-outline-variant/20 flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
<span class="text-[10px] font-bold font-headline uppercase tracking-tighter">Live_Feed</span>
</div>
</div>
</main>
<!-- Bottom Action Section (Heavy Frosted Glass Panel) -->
<div class="fixed bottom-0 left-0 w-full z-40">
<div class="mx-auto max-w-lg mb-28 px-6">
<section class="bg-surface-variant/60 backdrop-blur-[40px] rounded-t-[2.5rem] p-8 shadow-[0_-10px_40px_rgba(0,240,255,0.1)] border-t border-white/5">
<div class="flex flex-col items-center text-center gap-6">
<!-- Indeterminate Progress Indicator -->
<div class="relative w-16 h-16 flex items-center justify-center">
<svg class="absolute w-full h-full rotate-[-90deg]">
<circle class="text-outline-variant/30" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-primary-container" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-dasharray="175" stroke-dashoffset="120" stroke-width="4"></circle>
</svg>
<span class="material-symbols-outlined text-primary-container text-xl" style="font-variation-settings: 'FILL' 1;">qr_code_2</span>
</div>
<div class="space-y-1">
<h2 class="font-headline text-2xl font-bold tracking-tight text-primary">Awaiting Target Lock...</h2>
<p class="font-body text-sm text-on-surface-variant max-w-[240px] mx-auto opacity-80">Point your camera at a ZeroWire QR code to initiate the high-speed transfer.</p>
</div>
<!-- Instruction Chip -->
<div class="inline-flex items-center gap-3 px-6 py-3 rounded-full bg-surface-container-lowest/50 border border-outline-variant/10">
<span class="material-symbols-outlined text-sm text-secondary">info</span>
<span class="text-xs font-bold font-headline tracking-widest uppercase text-secondary-fixed-dim">Align Code in Frame</span>
</div>
</div>
</section>
</div>
</div>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-white/10 dark:bg-zinc-900/40 backdrop-blur-3xl rounded-t-[2rem] overflow-hidden tonal-transition-from-surface shadow-[0_-10px_40px_rgba(0,240,255,0.1)]">
<button class="flex flex-col items-center justify-center text-slate-400/60 hover:text-cyan-300 transition-colors tap-highlight-none active:scale-95 duration-300">
<span class="material-symbols-outlined">folder_open</span>
<span class="font-['Manrope'] text-[10px] font-bold tracking-wider uppercase mt-1">Files</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400/60 hover:text-cyan-300 transition-colors tap-highlight-none active:scale-95 duration-300">
<span class="material-symbols-outlined">ios_share</span>
<span class="font-['Manrope'] text-[10px] font-bold tracking-wider uppercase mt-1">Send</span>
</button>
<!-- Active Receiver State -->
<button class="flex flex-col items-center justify-center text-cyan-400 bg-cyan-400/10 rounded-xl px-4 py-1 hover:text-cyan-300 transition-colors tap-highlight-none active:scale-95 duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="font-['Manrope'] text-[10px] font-bold tracking-wider uppercase mt-1">Receive</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400/60 hover:text-cyan-300 transition-colors tap-highlight-none active:scale-95 duration-300">
<span class="material-symbols-outlined">history</span>
<span class="font-['Manrope'] text-[10px] font-bold tracking-wider uppercase mt-1">Recent</span>
</button>
</nav>
<!-- Decorative Corner Accents (System Visual Tokens) -->
<div class="fixed top-20 right-6 pointer-events-none opacity-20">
<div class="w-32 h-32 rounded-full bg-secondary-container/30 blur-[60px]"></div>
</div>
<div class="fixed bottom-40 left-6 pointer-events-none opacity-20">
<div class="w-40 h-40 rounded-full bg-primary-container/20 blur-[80px]"></div>
</div>
</body></html>
